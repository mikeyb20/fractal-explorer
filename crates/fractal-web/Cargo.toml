[package]
name = "fractal-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Web (WASM) front-end for fractal-explorer."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fractal-core = { path = "../fractal-core" }
wgpu = { version = "0.20", default-features = false, features = ["webgpu", "wgsl"] }
bytemuck = { version = "1.16", features = ["derive"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
log = "0.4"
console_log = { version = "1", features = ["color"] }
console_error_panic_hook = "0.1"
thiserror = "1"

[dependencies.web-sys]
version = "0.3"
features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement",
    "Location", "History", "DomRect",
    "Event", "EventTarget", "PointerEvent", "WheelEvent", "ResizeObserver",
    "ResizeObserverEntry", "ResizeObserverSize",
    "CssStyleDeclaration", "Navigator",
]

[lints]
workspace = true
